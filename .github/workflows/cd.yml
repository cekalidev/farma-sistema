name: CD

# Push a main: CI → imagen en GHCR → staging (simulado).
# Tag v* (creado sobre la punta de main): además, producción en Render tras la aprobación manual
# del environment `production`.
on:
  push:
    branches: [main]
    tags: ['v*']

concurrency:
  group: cd-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  ci:
    name: CI
    uses: ./.github/workflows/ci.yml

  imagen:
    name: Build y push a GHCR
    needs: ci
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      imagen: ${{ steps.imagen.outputs.ref }}
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # GHCR exige el nombre en minúsculas.
      - name: Nombre de la imagen
        id: nombre
        run: echo "valor=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Etiquetas (sha y versión)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.nombre.outputs.valor }}
          tags: |
            type=sha,format=long
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=main,enable=${{ github.ref == 'refs/heads/main' }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Referencia inmutable
        id: imagen
        run: echo "ref=${{ steps.nombre.outputs.valor }}:sha-${{ github.sha }}" >> "$GITHUB_OUTPUT"

  deploy-staging:
    name: Deploy a staging (simulado)
    needs: imagen
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - name: Desplegar
        run: |
          echo "Staging simulado: se desplegaría ${{ needs.imagen.outputs.imagen }}"
          echo "### Staging (simulado)" >> "$GITHUB_STEP_SUMMARY"
          echo "Imagen: \`${{ needs.imagen.outputs.imagen }}\`" >> "$GITHUB_STEP_SUMMARY"

  deploy-production:
    name: Deploy a producción (Render)
    needs: [imagen, deploy-staging]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    # Las reglas de protección del environment (revisores obligatorios) detienen el job hasta
    # que alguien lo aprueba en GitHub.
    environment:
      name: production
      url: ${{ vars.RENDER_SERVICE_URL }}
    steps:
      - name: Llamar al Deploy Hook de Render
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          if [ -z "${RENDER_DEPLOY_HOOK_URL}" ]; then
            echo "::warning::Falta el secreto RENDER_DEPLOY_HOOK_URL en el environment production; no se despliega."
            exit 0
          fi
          # La URL del hook es un secreto: no se imprime. El hook despliega el último commit de la
          # rama main del servicio y Render construye su Dockerfile (no usa la imagen de GHCR).
          curl -fsS -X POST "${RENDER_DEPLOY_HOOK_URL}" -o /dev/null
          echo "Deploy solicitado a Render: último commit de main (tag ${GITHUB_REF_NAME}); imagen equivalente en GHCR: ${{ needs.imagen.outputs.imagen }}"
