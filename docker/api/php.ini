; Ajustes de producción de la API (se suman a php.ini-production)
expose_php = Off
memory_limit = 256M
max_execution_time = 30
upload_max_filesize = 2M
post_max_size = 2M
; RN-10-AC8: las trazas no incluyen argumentos (podrían ser datos de un paciente)
zend.exception_ignore_args = On
log_errors = On
error_log = /proc/self/fd/2
display_errors = Off

; OPcache: código inmutable dentro de la imagen → sin comprobar marcas de tiempo
opcache.enable = 1
opcache.enable_cli = 0
opcache.memory_consumption = 128
opcache.interned_strings_buffer = 16
opcache.max_accelerated_files = 20000
opcache.validate_timestamps = 0
opcache.jit = off
