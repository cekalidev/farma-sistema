; Pool único de PHP-FPM. Corre como el usuario de la imagen (www-data, sin root), por eso no hay
; directivas user/group. Escucha solo en loopback: Nginx, en el mismo contenedor, es el único cliente.
[global]
error_log = /proc/self/fd/2
log_limit = 8192
daemonize = no

[www]
listen = 127.0.0.1:9000
pm = dynamic
pm.max_children = 8
pm.start_servers = 2
pm.min_spare_servers = 1
pm.max_spare_servers = 3
pm.max_requests = 500
; Logs de Laravel (LOG_CHANNEL=stderr) hacia el stderr del contenedor, sin envoltorio de FPM.
catch_workers_output = yes
decorate_workers_output = no
clear_env = no
access.log = /dev/null
